[package]
name = "timeseries_forecast"
version = "0.1.0"
edition = "2021"
description = "Biblioteca Rust para previsão de séries temporais com integração Python"
license = "MIT OR Apache-2.0"
categories = ["science", "algorithms"]
keywords = ["timeseries", "forecast", "rust", "python"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[lib]
crate-type = ["rlib", "cdylib"]
